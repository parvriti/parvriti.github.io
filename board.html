<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parvriti">
<meta name="theme-color" content="#0a0406">
<title>Our Board 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Great+Vibes&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('parvritiTheme')||'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#fbf1f1':'#0a0406');}catch(e){}</script>
<link rel="stylesheet" href="css/styles.css?v=132">
<link rel="stylesheet" href="css/theme.css?v=132">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body data-page="board">

<div class="page">
  <nav class="tabbar" id="nav"></nav>

  <main class="col page-fade">
    <div class="room-head">
      <div class="room-title">Our Board</div>
      <div class="room-sub">a little corner that's just ours</div>
    </div>

    <section class="wall" id="wall">
      <div class="lights" id="lights" aria-hidden="true"><div class="wire"></div></div>
      <svg class="travel" viewBox="0 0 340 220" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
        <path class="tv-map" d="M20,120 q30,-26 66,-12 q22,10 44,-4 q26,-18 52,-2 q30,16 60,-6 q22,-14 44,-4"/>
        <path class="tv-map" d="M30,160 q40,10 78,-6 q30,-12 60,4 q34,16 66,0 q26,-12 46,-2"/>
        <path class="tv-path" d="M46,168 q90,-120 250,-96"/>
        <g class="tv-plane"><path d="M0,-4 L11,0 L0,4 L2,0 Z M-2,-2 L4,0 L-2,2 Z"/></g>
        <circle class="tv-dot" cx="46" cy="168" r="2.4"/>
        <circle class="tv-dot" cx="296" cy="72" r="2.4"/>
      </svg>
      <div class="wall-label">reasons i love you</div>
      <div class="wall-tools">
        <button class="wtool" id="addReason" type="button">＋ reason</button>
        <button class="wtool" id="addPhoto" type="button">＋ photo</button>
        <button class="wtool edit" id="editBoard" type="button">✎ edit</button>
      </div>
      <div class="board-stage veil-load" id="boardStage">
      <div class="board" id="board"></div>
      <div class="board-empty" id="boardEmpty" style="display:none">
        <svg class="be-ic" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="32" cy="13" r="4"/><path d="M32 17v3"/>
          <rect x="15" y="20" width="34" height="32" rx="4"/>
          <path d="M25 35c0-3.2 4.2-4.2 5.4-1.1 1.2-3.1 5.4-2.1 5.4 1.1 0 3.2-5.4 6.4-5.4 6.4s-5.4-3.2-5.4-6.4z"/>
        </svg>
        <div class="be-title">nothing pinned yet</div>
        <div class="be-sub">tap ＋ to pin your first little thing 🌸</div>
      </div>
      <div class="load-veil on-cork" id="boardLoad" aria-hidden="true">
        <svg class="lv-bloom" viewBox="0 0 150 150" aria-hidden="true"><ellipse cx="75" cy="20" rx="12" ry="19" fill="#b03050" opacity=".9" transform="rotate(0 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#c0425a" opacity=".9" transform="rotate(45 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#8b2040" opacity=".9" transform="rotate(90 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#c0425a" opacity=".9" transform="rotate(135 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#b03050" opacity=".9" transform="rotate(180 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#c0425a" opacity=".9" transform="rotate(225 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#8b2040" opacity=".9" transform="rotate(270 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#c0425a" opacity=".9" transform="rotate(315 75 75)"/></svg>
        <span class="lv-cap">loading&hellip;</span>
      </div>
      </div>
      <button class="more-room" id="moreRoom" type="button">＋ more room</button>
    </section>

    <div class="room-foot">made with love, for us 🌸</div>
  </main>
</div>

<input type="file" id="photoInput" accept="image/*" style="display:none">
<div class="room-toast" id="roomToast"></div>

<nav class="proto-tabbar" id="protoTabbar" aria-label="Main"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/common.js?v=132"></script>
<script src="js/board.js?v=132"></script>
<script src="js/native.js?v=132"></script>
</body>
</html>
