<script>/* launch splash: only in an installed PWA on an iOS/iPadOS device (touch device), once per cold launch. maxTouchPoints>0 excludes a Mac PWA (display-mode:standalone is true there too). Set the class before first paint so the black splash is frame one - never a flash. */try{var _s=((window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true)&&navigator.maxTouchPoints>0;if(_s&&!sessionStorage.getItem('pl_shown')){sessionStorage.setItem('pl_shown','1');document.documentElement.classList.add('plaunch-on');document.documentElement.classList.add('plaunch-bg');}}catch(e){}</script>

</div>

  <!-- ══ INTRO ══ -->

    <div class="intro-bloom">
      <svg viewBox="0 0 150 150" style="width:150px;height:150px;position:absolute;inset:0;animation:spinS 18s linear infinite;">

<script>
  /* the entry ritual is archived (see old_ideas/). "Open it" now hands
     straight into the app, keeping the petal-bloom transition. */
  function enterApp(){
    try { sessionStorage.setItem('riti_open','1'); } catch(e){}
    var o = document.getElementById('bloomOv');
    if(o){ o.classList.add('go'); setTimeout(function(){ o.classList.remove('go'); }, 1100); }
    setTimeout(function(){ location.href = 'open-when.html'; }, 620);
  }
</script>
<script>
/* drive the launch splash: wait (briefly) for the wordmark font so the heart-dot lands on the right
   metrics, ink the name in + drop the heart, then lift the MOMENT the animation finishes - it does NOT
   wait on auth, so the app opens fast (~1s, the compressed animation's own length). Home is static markup that is
   already painted underneath, and for a returning user the "Only for us." gate is transparent
   (gate-quiet) and resolves silently, so lifting straight to Home never flashes it. */
(function(){
  if(!document.documentElement.classList.contains('plaunch-on')) return;
  var pl=document.getElementById('plaunch'); if(!pl) return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var started=false;
  function start(){ if(started)return; started=true;
    pl.classList.add('go');
    var hold=reduce?450:1000;   // compressed splash: ink-in (~0.6s) + heart drop (ends ~0.94s); lift just after, no auth wait -> ~1s total
    setTimeout(function(){
      document.documentElement.classList.remove('plaunch-bg');   // revert the page ground to the app theme NOW, so the fading splash reveals the real (light) background - no black frame on the way out (iPad exposed this)
      pl.classList.add('lift');
      setTimeout(function(){ if(pl.parentNode)pl.parentNode.removeChild(pl); document.documentElement.classList.remove('plaunch-on'); }, 500);
    }, hold);
  }
  try{
    if(document.fonts&&document.fonts.load){ document.fonts.load("700 1em 'Dancing Script'").then(start,start); setTimeout(start,1100); }
    else setTimeout(start,300);
  }catch(e){ setTimeout(start,300); }
})();
</script>
