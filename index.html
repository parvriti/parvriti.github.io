<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="For Toti 🌸">
<meta name="theme-color" content="#0a0406">
<title>For Toti 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Great+Vibes&family=Permanent+Marker&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('parvritiTheme')||'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#fbf1f1':'#0a0406');}catch(e){}</script>
<link rel="stylesheet" href="css/styles.css?v=102">
<link rel="stylesheet" href="css/theme.css?v=102">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body data-page="home">

<div class="canvas">

  <!-- ══ INTRO ══ -->
  <div class="screen active" id="s-intro">
    <div class="intro-bloom">
      <svg viewBox="0 0 150 150" style="width:150px;height:150px;position:absolute;inset:0;animation:spinS 18s linear infinite;">
        <ellipse cx="75" cy="20" rx="12" ry="19" fill="#c0425a" opacity=".78" transform="rotate(0 75 75)"/>
        <ellipse cx="75" cy="20" rx="12" ry="19" fill="#d4607a" opacity=".78" transform="rotate(45 75 75)"/>
        <ellipse cx="75" cy="20" rx="12" ry="19" fill="#b03050" opacity=".78" transform="rotate(90 75 75)"/>
        <ellipse cx="75" cy="20" rx="12" ry="19" fill="#e07090" opacity=".78" transform="rotate(135 75 75)"/>
        <ellipse cx="75" cy="20" rx="12" ry="19" fill="#c0425a" opacity=".78" transform="rotate(180 75 75)"/>
        <ellipse cx="75" cy="20" rx="12" ry="19" fill="#d4607a" opacity=".78" transform="rotate(225 75 75)"/>
        <ellipse cx="75" cy="20" rx="12" ry="19" fill="#b03050" opacity=".78" transform="rotate(270 75 75)"/>
        <ellipse cx="75" cy="20" rx="12" ry="19" fill="#e07090" opacity=".78" transform="rotate(315 75 75)"/>
      </svg>
      <div class="center-jewel">🌸</div>
    </div>
    <div class="headline">For you,<br>Toti.</div>
    <div class="sub">Our little world awaits inside</div>
    <button class="btn-rose" onclick="enterApp()">Open it ✦</button>
    <div class="day-counter" data-daycounter></div>
    <div class="last-seen" data-lastseen style="display:none"></div>
    <div class="home-state" data-homestate style="display:none"></div>
  </div>
</div><!-- /canvas -->

<!-- Bloom overlay (screen transitions) -->
<div class="bloom-ov" id="bloomOv">
  <svg width="90" height="90" viewBox="0 0 100 100">
    <ellipse cx="50" cy="14" rx="9" ry="15" fill="#c0425a" opacity=".8" transform="rotate(0 50 50)"/>
    <ellipse cx="50" cy="14" rx="9" ry="15" fill="#d4607a" opacity=".8" transform="rotate(60 50 50)"/>
    <ellipse cx="50" cy="14" rx="9" ry="15" fill="#b03050" opacity=".8" transform="rotate(120 50 50)"/>
    <ellipse cx="50" cy="14" rx="9" ry="15" fill="#e07090" opacity=".8" transform="rotate(180 50 50)"/>
    <ellipse cx="50" cy="14" rx="9" ry="15" fill="#c0425a" opacity=".8" transform="rotate(240 50 50)"/>
    <ellipse cx="50" cy="14" rx="9" ry="15" fill="#d4607a" opacity=".8" transform="rotate(300 50 50)"/>
    <circle cx="50" cy="50" r="13" fill="#f9c6c6"/>
  </svg>
</div>

<nav class="proto-tabbar" id="protoTabbar" aria-label="Main"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/common.js?v=102"></script>
<script>
  /* the entry ritual is archived (see old_ideas/). "Open it" now hands
     straight into the app, keeping the petal-bloom transition. */
  function enterApp(){
    try { sessionStorage.setItem('riti_open','1'); } catch(e){}
    var o = document.getElementById('bloomOv');
    if(o){ o.classList.add('go'); setTimeout(function(){ o.classList.remove('go'); }, 1100); }
    setTimeout(function(){ location.href = 'open-when.html'; }, 620);
  }
</script>
<script src="js/native.js?v=102"></script>
</body>
</html>
