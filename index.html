<script>/* launch splash: only in the installed PWA, once per cold launch. Set the class before first paint so the black splash is frame one - never a flash. */try{var _s=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;if(_s&&!sessionStorage.getItem('pl_shown')){sessionStorage.setItem('pl_shown','1');document.documentElement.classList.add('plaunch-on');}}catch(e){}</script>

<script>
  /* the entry ritual is archived (see old_ideas/). "Open it" now hands
     straight into the app, keeping the petal-bloom transition. */
  function enterApp(){
    try { sessionStorage.setItem('riti_open','1'); } catch(e){}
    var o = document.getElementById('bloomOv');
    if(o){ o.classList.add('go'); setTimeout(function(){ o.classList.remove('go'); }, 1100); }
    setTimeout(function(){ location.href = 'open-when.html'; }, 620);
  }
</script>
<script>
/* drive the launch splash: wait for the wordmark font (so the heart-dot lands on the right metrics),
   ink the name in + drop the heart, then lift ONLY once auth has resolved - so an authed user lands
   straight on Home (the "Only for us." gate resolves hidden behind the splash and is never seen),
   while a genuine sign-in need reveals the gate. A hard cap prevents hanging on a dead network. */
(function(){
  if(!document.documentElement.classList.contains('plaunch-on')) return;
  var pl=document.getElementById('plaunch'); if(!pl) return;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var started=false, gateSeen=false;
  function homeReady(){
    var g=document.getElementById('authGate');
    if(g){ gateSeen=true; return g.classList.contains('ready'); }   // 'ready' = sign-in is actually needed; gate-quiet / bare = still resolving
    return gateSeen;                                                // gate removed after being seen = signed in, Home is ready
  }
  function lift(){
    pl.classList.add('lift');
    setTimeout(function(){ if(pl.parentNode)pl.parentNode.removeChild(pl); document.documentElement.classList.remove('plaunch-on'); }, 700);
  }
  function start(){ if(started)return; started=true;
    pl.classList.add('go');
    var t0=Date.now(), minAnim=reduce?800:2000, cap=6000;
    (function tick(){
      var el=Date.now()-t0;
      if(el>=minAnim && (homeReady()||el>=cap)) lift();
      else setTimeout(tick, 90);
    })();
  }
  try{
    if(document.fonts&&document.fonts.load){ document.fonts.load("700 1em 'Dancing Script'").then(start,start); setTimeout(start,1600); }
    else setTimeout(start,300);
  }catch(e){ setTimeout(start,300); }
})();
</script>
<script src="js/native.js?v=109"></script>
