<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="For Toti 🌸">
<meta name="theme-color" content="#0a0406">
<title>Open When… 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="open-when">

<div class="page">
  <nav class="tabbar" id="nav"></nav>

  <main class="col page-fade">
    <div class="ow-sides">
      <button class="ow-side active" type="button" data-side="riti">For Riti</button>
      <button class="ow-side" type="button" data-side="parv">For Parv</button>
    </div>
    <div class="ow-head">
      <div class="ow-kicker" id="owKicker">Sealed · for the right moment</div>
      <div class="ow-title" id="owTitle">Open When…</div>
      <div class="ow-note" id="owNote"></div>
    </div>
    <div class="ow-grid" id="owGrid"></div>
  </main>
</div>

<!-- Reader overlay: envelope opens → parchment letter -->
<div class="ow-reader" id="owReader">
  <button class="ow-close" type="button" onclick="closeWhen()">✕ close</button>
  <div class="env-stage" id="envStage">
    <div class="env" id="env">
      <div class="env-back"></div>
      <div class="env-letter"></div>
      <div class="env-pocket"></div>
      <div class="env-flap"></div>
      <div class="env-seal">❤</div>
    </div>
  </div>
  <div class="ow-paper" id="owPaper">
    <div class="ow-paper-emoji" id="owPaperEmoji"></div>
    <div class="ow-paper-title" id="owPaperTitle"></div>
    <div class="ow-paper-rule"></div>
    <div class="ow-voice">
      <button type="button" class="voice-btn" id="owPlayBtn" onclick="toggleVoice()">
        <span class="voice-ic" id="owPlayIc">▶</span>
        <span id="owPlayLbl">Play his voice</span>
      </button>
      <div class="voice-hint" id="owVoiceHint"></div>
    </div>
    <div class="ow-paper-body" id="owPaperBody"></div>
    <button class="ow-note-del" id="owNoteDel" type="button" onclick="deleteCurrentNote()" style="display:none">delete this note</button>
  </div>
  <audio id="owAudio" preload="none"></audio>
</div>

<!-- Add-a-note form -->
<div class="ow-reader" id="owAddOverlay">
  <button class="ow-close" type="button" onclick="closeAdd()">✕ close</button>
  <form class="ow-form" id="owForm" onsubmit="return saveNote(event)">
    <h3>Add a note <span id="owFormWho">for Riti</span> ✍️</h3>
    <label for="owInTitle">Title</label>
    <input class="ow-input" id="owInTitle" type="text" maxlength="40" placeholder="e.g. Open when you win" autocomplete="off"/>
    <label for="owInBody">Your words</label>
    <textarea class="ow-textarea" id="owInBody" placeholder="Write your note… line breaks are kept."></textarea>
    <div class="ow-form-err" id="owFormErr"></div>
    <div class="ow-form-actions">
      <button type="button" class="ow-cancel" onclick="closeAdd()">Cancel</button>
      <button type="submit" class="ow-save">Save note</button>
    </div>
  </form>
</div>

<script src="js/common.js"></script>
<script src="js/open-when.js"></script>
</body>
</html>
