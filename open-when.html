<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="For Toti 🌸">
<meta name="theme-color" content="#0a0406">
<title>Open When… 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('parvritiTheme')||'dark')}catch(e){}</script>
<link rel="stylesheet" href="css/styles.css?v=75">
<link rel="stylesheet" href="css/theme.css?v=75">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body data-page="open-when">

<div class="page">
  <nav class="tabbar" id="nav"></nav>

  <main class="col page-fade">
    <div class="ow-sides">
      <button class="ow-side active" type="button" data-side="riti">For Riti</button>
      <button class="ow-side" type="button" data-side="parv">For Parv</button>
    </div>
    <div class="ow-head">
      <div class="ow-kicker" id="owKicker">Written by Pavu · for you</div>
      <div class="ow-title" id="owTitle">Open When…</div>
      <div class="ow-note" id="owNote"></div>
    </div>
    <div class="ow-editbar">
      <button class="ow-edit-toggle" id="owEditToggle" type="button">✎ Edit</button>
    </div>
    <div class="ow-otd" id="owOnThisDay" style="display:none"></div>
    <div class="ow-grid" id="owGrid"></div>
  </main>
</div>

<!-- Reader overlay: envelope opens → parchment letter -->
<div class="ow-reader" id="owReader">
  <button class="ow-close" type="button" onclick="closeWhen()">✕ close</button>
  <div class="env-stage" id="envStage">
    <div class="env" id="env">
      <div class="env-back"></div>
      <div class="env-letter"></div>
      <div class="env-pocket"></div>
      <div class="env-flap"></div>
      <div class="env-seal">❤</div>
    </div>
  </div>
  <div class="ow-paper" id="owPaper"><div id="owPaperContent"></div></div>
  <audio id="owAudio" preload="none"></audio>
</div>

<!-- Add / edit form -->
<div class="ow-reader" id="owAddOverlay">
  <button class="ow-close" type="button" onclick="closeAdd()">✕ close</button>
  <form class="ow-form" id="owForm" onsubmit="return saveForm(event)">
    <h3 id="owFormHeading">New envelope</h3>
    <div id="owTitleWrap">
      <label for="owInTitle">Title</label>
      <input class="ow-input" id="owInTitle" type="text" maxlength="40" placeholder="e.g. When you win" autocomplete="off"/>
      <label for="owInEmoji">Emoji</label>
      <input class="ow-input ow-emoji-input" id="owInEmoji" type="text" maxlength="12" value="💌" autocomplete="off"/>
    </div>
    <label for="owInBody">Your words</label>
    <textarea class="ow-textarea" id="owInBody" placeholder="Write your note…"></textarea>
    <div class="ow-voice-rec">
      <label>Voice note (optional)</label>
      <div class="ow-rec-row" id="owRecIdle"><button type="button" class="ow-rec-btn rec" id="owRecStart">● Record</button></div>
      <div class="ow-rec-row" id="owRecActive" style="display:none"><span class="ow-rec-dot"></span><span class="ow-rec-time" id="owRecTimer">0:00</span><button type="button" class="ow-rec-btn stop" id="owRecStop">■ Stop</button></div>
      <div class="ow-rec-row" id="owRecHave" style="display:none"><button type="button" class="ow-rec-btn" id="owRecPlay">▶ Play</button><button type="button" class="ow-rec-btn" id="owRecRedo">Re-record</button><button type="button" class="ow-rec-btn" id="owRecDel">Remove</button></div>
      <div class="ow-rec-hint" id="owRecHint"></div>
      <audio id="owRecAudio" style="display:none"></audio>
    </div>
    <div class="ow-seal-field" id="owSealField">
      <label for="owInOpen">Seal until (optional)</label>
      <input class="ow-input" id="owInOpen" type="date" autocomplete="off"/>
      <div class="ow-seal-hint">If set, this note stays locked until that day, even for you.</div>
    </div>
    <div class="ow-form-err" id="owFormErr"></div>
    <div class="ow-form-actions">
      <button type="button" class="ow-cancel" onclick="closeAdd()">Cancel</button>
      <button type="submit" class="ow-save">Save</button>
    </div>
  </form>
</div>

<nav class="proto-tabbar" id="protoTabbar" aria-label="Main"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/common.js?v=75"></script>
<script src="js/open-when.js?v=75"></script>
<script src="js/native.js?v=75"></script>
</body>
</html>
