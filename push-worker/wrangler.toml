# Cloudflare Worker config for the parvriti push worker.
#
# Without this file, `wrangler deploy` (v4+) cannot tell that worker.js is the
# entry point and fails trying to deploy static assets ("Could not detect a
# directory containing static files").
#
# The [triggers] crons below MUST stay in sync with worker.js's scheduled()
# handler. A deploy reconciles the schedules to match this list, so removing a
# line here would DELETE that cron from the live worker:
#   "30 18 * * *" = 00:00 IST -> birthday / anniversary wish
#   "30 3 * * *"  = 09:00 IST -> cycle heads-up + capsule-unlock nudges
#
# Secrets (SERVICE_ACCOUNT, HOME_SECRET_RITI, HOME_SECRET_PARV, FIREBASE_API_KEY)
# live as encrypted secrets on Cloudflare and are NOT managed here; a deploy
# leaves them untouched. Local dev reads them from .dev.vars (gitignored).
name = "parvriti-push"
main = "worker.js"
compatibility_date = "2024-11-01"
# The app never uses per-version preview URLs; keep them off so the only public
# surface is the one workers.dev route. Applies on the next deploy.
preview_urls = false

# FIREBASE_API_KEY is the PUBLIC Firebase web key (already in js/common.js and
# firebase-messaging-sw.js). verifyCaller() uses it to check a caller's ID token.
# It is a plaintext dashboard Variable, NOT an encrypted secret, so a `wrangler
# deploy` DROPS it unless declared here - which silently breaks every in-app push
# (403 'FIREBASE_API_KEY missing'). Declaring it makes CLI deploys carry it.
# NEVER put SERVICE_ACCOUNT / HOME_SECRET_* / HEARTBEAT_SECRET_* here - those stay
# encrypted secrets set via `wrangler secret put` / the dashboard.
[vars]
FIREBASE_API_KEY = "AIzaSyBW_EMfKIkIJDNSMPUp6UeHOGtIdv26Wpk"

[triggers]
crons = ["30 18 * * *", "30 3 * * *"]
