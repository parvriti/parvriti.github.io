<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="For Toti 🌸">
<meta name="theme-color" content="#0a0406">
<title>Doodles 🌸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&family=Great+Vibes&family=Caveat:wght@400;600;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('parvritiTheme')||'dark';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#fbf1f1':'#0a0406');}catch(e){}</script>
<link rel="stylesheet" href="css/styles.css?v=110">
<link rel="stylesheet" href="css/theme.css?v=110">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
</head>
<body data-page="doodles">

<div class="page">
  <nav class="tabbar" id="nav"></nav>

  <main class="col page-fade">
    <div class="room-head">
      <div class="room-title">Doodles</div>
      <div class="room-sub">draw, and it shows up on their screen</div>
    </div>

    <div class="pad-wrap">
      <div class="pad">
        <div class="clip" aria-hidden="true"></div>
        <canvas id="pad" width="720" height="900"></canvas>
        <div class="tools">
          <div class="tool-row">
            <span class="swatch sel" style="background:#c0425a" data-c="#c0425a"></span>
            <span class="swatch" style="background:#f76707" data-c="#f76707"></span>
            <span class="swatch" style="background:#e0a020" data-c="#e0a020"></span>
            <span class="swatch" style="background:#1d9e75" data-c="#1d9e75"></span>
            <span class="swatch" style="background:#15aabf" data-c="#15aabf"></span>
            <span class="swatch" style="background:#2942c0" data-c="#2942c0"></span>
            <span class="swatch" style="background:#8a3ffb" data-c="#8a3ffb"></span>
            <span class="swatch" style="background:#e64980" data-c="#e64980"></span>
            <span class="swatch" style="background:#2f2a26" data-c="#2f2a26"></span>
            <label class="swatch swatch-wheel" id="customSwatch"><input type="color" id="customColor" value="#c0425a" aria-label="Pick a custom colour"></label>
          </div>
          <div class="tool-row">
            <span class="nib s1" data-s="3"></span>
            <span class="nib s2 sel" data-s="6"></span>
            <span class="nib s3" data-s="12"></span>
            <button class="water" id="waterTool" type="button" aria-label="Watercolor brush">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9.5" cy="9.5" r="5.5"/><circle cx="14.5" cy="14.5" r="5.5"/></svg>
            </button>
            <button class="erase" id="eraseTool" type="button" aria-label="Eraser">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
            </button>
            <button class="fill" id="fillTool" type="button" aria-label="Fill">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M21.5 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg>
            </button>
            <button class="undo" id="undoTool" type="button" aria-label="Undo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5 5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
            </button>
            <button class="clear" id="clearPad" type="button" aria-label="Clear">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
            </button>
          </div>
        </div>
        <div class="pad-cap">
          <div class="by" id="padBy">draw something silly together</div>
          <button class="keep-in" id="keepBtn" type="button" aria-label="Keep this doodle" title="Keep this doodle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
        </div>
        <div class="load-veil on-cream" id="doodleLoad" aria-hidden="true">
          <svg class="lv-bloom" viewBox="0 0 150 150" aria-hidden="true"><ellipse cx="75" cy="20" rx="12" ry="19" fill="#b03050" opacity=".9" transform="rotate(0 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#c0425a" opacity=".9" transform="rotate(45 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#8b2040" opacity=".9" transform="rotate(90 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#c0425a" opacity=".9" transform="rotate(135 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#b03050" opacity=".9" transform="rotate(180 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#c0425a" opacity=".9" transform="rotate(225 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#8b2040" opacity=".9" transform="rotate(270 75 75)"/><ellipse cx="75" cy="20" rx="12" ry="19" fill="#c0425a" opacity=".9" transform="rotate(315 75 75)"/></svg>
          <span class="lv-cap">loading&hellip;</span>
        </div>
      </div>
    </div>

    <div class="room-foot">made with love, for us 🌸</div>
  </main>
</div>

<div class="room-toast" id="roomToast"></div>

<!-- kept doodles: shelf entry (mirrors the settings gear), the shelf sheet, the single-doodle viewer, the editor bar -->
<button class="proto-corner proto-left shelf-corner" id="shelfCorner" type="button" aria-label="Kept doodles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/></svg></button>

<div class="shelf-ov" id="shelfOv" aria-hidden="true">
  <div class="shelf-sheet">
    <div class="shelf-head">
      <button class="shelf-x" id="shelfClose" type="button" aria-label="Back to the pad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span>Pad</span></button>
      <div class="shelf-h-title">Doodles</div>
      <span class="shelf-h-spacer" aria-hidden="true"></span>
    </div>
    <div class="shelf-body" id="shelfBody"></div>
  </div>
</div>

<div class="doodle-viewer" id="doodleViewer" aria-hidden="true"></div>

<div class="edit-bar" id="editBar" aria-hidden="true">
  <button class="edit-back" id="editBack" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg> Done</button>
  <span class="edit-name" id="editNameLbl">untitled</span>
  <button class="edit-save" id="editSave" type="button">Save</button>
</div>

<nav class="proto-tabbar" id="protoTabbar" aria-label="Main"></nav>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/common.js?v=110"></script>
<script src="js/doodle.js?v=110"></script>
<script src="js/native.js?v=110"></script>
</body>
</html>
